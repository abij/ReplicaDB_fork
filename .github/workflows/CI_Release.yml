# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI/CD ReplicaDB Release

on:
  push:
    tags:
      - 'v*'
      - 'adls2-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'adopt'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Get version
      run: |
        if [ "${{ github.event.inputs.version }}" != "" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        else
          echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec) " >> $GITHUB_ENV
        fi

    - name: Set release tag
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "release_tag=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          echo "release_tag=v${{ env.version }}" >> $GITHUB_ENV
        fi

    # --- Preview builds (adls2-*): only produce the fat jar ---

    - name: Build fat jar (preview)
      if: startsWith(github.ref_name, 'adls2-')
      run: |
        mvn clean package -Dmaven.javadoc.skip=true -DskipTests -B -P release
        find ./target -name "*-jar-with-dependencies.jar" -type f
        cp ./target/*-jar-with-dependencies.jar .

    - name: Smoke test fat jar (preview)
      if: startsWith(github.ref_name, 'adls2-')
      run: |
        FAT_JAR=$(find . -maxdepth 1 -name "*-jar-with-dependencies.jar" -type f | head -1)
        echo "Testing: $FAT_JAR"
        java -jar "$FAT_JAR" --help 2>&1 | head -5
        echo "Exit code: $?"

    - name: Upload fat jar to preview release
      if: startsWith(github.ref_name, 'adls2-')
      run: |
        TAG="${{ env.release_tag }}"
        FAT_JAR=$(find . -maxdepth 1 -name "*-jar-with-dependencies.jar" -type f | head -1)
        if [ -z "$FAT_JAR" ]; then
          echo "ERROR: fat jar not found"; ls -la; exit 1
        fi
        gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1 || \
          gh release create "$TAG" --prerelease --title "$TAG" --notes "" --repo ${{ github.repository }}
        gh release upload "$TAG" "$FAT_JAR" --clobber --repo ${{ github.repository }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # --- Version builds (v*): full release with archives, fat jar, and Docker ---

    - name: Maven Install
      if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
      run: |
        export REPLICADB_RELEASE_VERSION=${{ env.version }}
        mvn clean install -Dmaven.javadoc.skip=true -DskipTests -B -V -P release
        cp ./target/ReplicaDB-*.jar .
        mkdir lib
        cp ./target/lib/* ./lib
        tar -zcvf ReplicaDB-${REPLICADB_RELEASE_VERSION}.tar.gz ReplicaDB-*.jar README.md lib conf bin LICENSE
        zip -r -X ReplicaDB-${REPLICADB_RELEASE_VERSION}.zip ReplicaDB-*.jar README.md lib conf bin LICENSE
        ls -lah

    - name: Smoke test fat jar
      if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
      run: |
        FAT_JAR=$(find . -maxdepth 1 -name "*-jar-with-dependencies.jar" -type f | head -1)
        echo "Testing: $FAT_JAR"
        java -jar "$FAT_JAR" --help 2>&1 | head -5
        echo "Exit code: $?"

    - name: Maven Install no-oracle
      if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
      run: |
        export REPLICADB_RELEASE_VERSION=${{ env.version }}
        mvn clean install -Dmaven.javadoc.skip=true -DskipTests -B -V -P release-no-oracle
        cp ./target/ReplicaDB-*.jar .
        rm -Rf lib 2>/dev/null
        mkdir lib
        cp ./target/lib/* ./lib
        tar -zcvf ReplicaDB-${REPLICADB_RELEASE_VERSION}-no-oracle.tar.gz ReplicaDB-*.jar README.md lib conf bin LICENSE
        zip -r -X ReplicaDB-${REPLICADB_RELEASE_VERSION}-no-oracle.zip ReplicaDB-*.jar README.md lib conf bin LICENSE
        ls -lah

    - uses: "marvinpinto/action-automatic-releases@latest"
      if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: ${{ env.release_tag }}
        prerelease: false
        files: |
          ReplicaDB-*-jar-with-dependencies.jar
          ReplicaDB-*.zip
          ReplicaDB-*.tar.gz

    -   name: Set up QEMU
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4

    -   name: Set up Docker Buildx
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

    -   name: Login to DockerHub
        if: (startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    -   name: Build and push
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: osalvador/replicadb:${{ env.version }}, osalvador/replicadb:latest
          build-args: REPLICADB_RELEASE_VERSION=${{ env.version }}

    -   name: Build and push
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: osalvador/replicadb:ubi9-${{ env.version }}, osalvador/replicadb:ubi9-latest
          build-args: REPLICADB_RELEASE_VERSION=${{ env.version }}
